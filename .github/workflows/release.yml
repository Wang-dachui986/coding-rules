name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Package skill and publish GitHub Release
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Validate skill
        working-directory: coding-rules
        run: uv run --python python scripts/validate_skill.py

      - name: Test validator
        working-directory: coding-rules
        run: uv run --python python scripts/test_validate_skill.py

      - name: Package skill zip
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/package_skill.py "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "asset=dist/coding-rules-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="${{ steps.package.outputs.asset }}"
          version="${{ steps.package.outputs.version }}"
          checksum="$(sha256sum "$asset" | awk '{print $1}')"
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          Installable skill package for ${GITHUB_REF_NAME}.

          The archive contains \`LICENSE\` and the \`coding-rules/\` directory (\`SKILL.md\` is inside that directory). Copy \`coding-rules\` to \`~/.agents/skills/\` or \`~/.codex/skills/\`. Restart Codex if \`\$coding-rules\` does not appear.

          SHA-256 (\`coding-rules-${version}.zip\`): \`${checksum}\`

          The change list is in [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/CHANGELOG.md).
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes"
          fi
